<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Document Outline -->
  <path d="M160 96 H304 L368 160 V416 C368 424.8 360.8 432 352 432 H160 C151.2 432 144 424.8 144 416 V112 C144 103.2 151.2 96 160 96 Z"
        fill="#0f172a" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Folded Corner -->
  <path d="M304 96 V160 H368" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Distinctive M & D Letterforms -->
  <!-- 'M' Symbol -->
  <path d="M192 336 V240 L228 296 L264 240 V336" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- 'Down' / Document Arrow -->
  <path d="M312 248 V316 M294 300 L312 318 L330 300" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
